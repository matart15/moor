name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # crate 在子目录,须显式指定否则 rust-cache 键指向仓库根
          cache-workspaces: src-tauri

      # frontendDist ../dist 被 gitignore;无 dist 时 tauri generate_context! 编译失败
      - name: Placeholder frontend dist
        run: mkdir -p dist && echo '<!doctype html><title>ci-placeholder</title>' > dist/index.html

      - name: Run cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # v5 默认开启会在此步寻找 pnpm(尚未安装)而失败
          package-manager-cache: false

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # cargo-test 不覆盖前端;类型错误须在 push 阶段拦截,而非 release 构建时爆
      - name: Lint, format check and type-check
        run: pnpm exec vp check

      - name: Run frontend tests
        run: pnpm exec vp test

  build-moor-dev:
    # Build an unsigned test app only when explicitly requested, not on every push.
    if: github.event_name == 'workflow_dispatch'
    needs: [cargo-test, frontend-check]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin
          cache-workspaces: src-tauri
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build isolated Moor Dev app
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app
      - name: Archive macOS app (preserve symlinks and permissions)
        shell: bash
        run: |
          set -euo pipefail
          app_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          test -d "$app_dir/Moor Dev.app"
          tar -czf moor-dev-macos-arm64.tar.gz -C "$app_dir" "Moor Dev.app"
      - uses: actions/upload-artifact@v4
        with:
          name: moor-dev-macos-arm64
          path: moor-dev-macos-arm64.tar.gz
          retention-days: 7
